name: Undersök Länsstyrelsens karta

on:
  push:
    branches: [claude/fishing-boundary-alert-app-grz168]
    paths: ['fiskegrans/tools/**', '.github/workflows/probe-lst.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fiskegrans/tools/probe_lst.py "https://ext-webbgis.lansstyrelsen.se/3a06b1e6-9856-44f2-b1e3-ddee6c04a7b5/"
